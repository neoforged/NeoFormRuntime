import net.neoforged.gradleutils.PomUtilsExtension

plugins {
    id 'java'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '8.3.0'
    id "net.neoforged.gradleutils" version "5.0.1"
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.8"
}

group = 'net.neoforged'
base {
    archivesName = "neoform-runtime"
}
gradleutils.version {
    branches.suffixBranch()
}
project.version = gradleutils.version

changelog {
    from '0.1'
    // For fine-grained changelog publication control
    disableAutomaticPublicationRegistration()
}

repositories {
    mavenCentral()

    exclusiveContent {
        forRepository {
            maven {
                name = "Fabric"
                url = "https://maven.fabricmc.net/"
            }
        }
        filter {
            includeModule("net.fabricmc", "fabric-loom-native")
        }
    }

    exclusiveContent {
        forRepository {
            maven {
                name = "MinecraftForge"
                url = "https://maven.minecraftforge.net/"
            }
        }
        filter {
            includeModule("net.minecraftforge", "mergetool")
        }
    }
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach() {
    options.encoding = "UTF-8"
}

tasks.withType(Test).configureEach() {
    // Keep test output stable, including output from Java processes launched by integration tests.
    environment "_JAVA_OPTIONS", "-Duser.language=en -Duser.country=US"
}

def mainClassName = 'net.neoforged.neoform.runtime.cli.Main'

jar {
    manifest {
        attributes 'Main-Class': mainClassName
    }
}

AdhocComponentWithVariants javaComponent = (AdhocComponentWithVariants) project.components.getByName("java")

sourceSets {
    integrationTest
}

configurations {
    changelog {
        canBeResolved = false
        canBeConsumed = true
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.DOCUMENTATION))
            attribute(DocsType.DOCS_TYPE_ATTRIBUTE, objects.named(DocsType, "changelog"))
        }
        javaComponent.addVariantsFromConfiguration(it) {}
    }
    externalTools {
        canBeConsumed = true
        canBeResolved = false
        // NFRT generally ignores transitive dependencies when downloading tools, so we should too
        transitive = false
        attributes {
            attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
            attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
        }
        outgoing {
            capability "net.neoforged:neoform-runtime-external-tools:${project.version}"
        }
        components.java.addVariantsFromConfiguration(it) {}
    }
    integrationTestJavaSourceTransformer {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    integrationTestDiffPatch {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    integrationTestInstallerTools {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    integrationTestSideAnnotationStripper {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    integrationTestImplementation.extendsFrom(testImplementation)
    integrationTestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

def toolVersions = new java.util.Properties()
file("src/main/resources/tools.properties").withInputStream {
    toolVersions.load(it)
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.2'
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.eclipse.jdt:ecj:3.42.0'
    implementation 'net.fabricmc:fabric-loom-native:0.2.1'
    implementation 'net.neoforged:srgutils:1.0.10'
    implementation 'net.neoforged.installertools:problems-api:3.0.3'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    testImplementation platform('org.junit:junit-bom:5.13.2')
    testImplementation platform('org.mockito:mockito-bom:5.18.0')
    testImplementation platform('org.assertj:assertj-bom:3.27.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.junit.jupiter:junit-jupiter-params'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    integrationTestCompileOnly sourceSets.main.output
    integrationTestJavaSourceTransformer toolVersions.getProperty("JAVA_SOURCE_TRANSFORMER")
    integrationTestDiffPatch toolVersions.getProperty("DIFF_PATCH")
    integrationTestInstallerTools toolVersions.getProperty("INSTALLER_TOOLS")
    integrationTestSideAnnotationStripper toolVersions.getProperty("MCF_SIDE_ANNOTATION_STRIPPER")
}

// Add dependencies to external tools
for (var toolDependency : toolVersions.values()) {
    dependencies {
        externalTools(toolDependency)
    }
}

artifacts {
    // Only publish a changelog for releases
    changelog(createChangelog.outputFile) {
        builtBy(createChangelog)
        setClassifier("changelog")
        setExtension("txt")
    }
}

test {
    useJUnitPlatform()
}

final integrationTest = tasks.register("integrationTest", Test) {
    description = "Runs tests against the packaged NFRT command line"
    group = "verification"
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    dependsOn shadowJar
    inputs.file(shadowJar.archiveFile)
    inputs.files(
            configurations.integrationTestJavaSourceTransformer,
            configurations.integrationTestDiffPatch,
            configurations.integrationTestInstallerTools,
            configurations.integrationTestSideAnnotationStripper
    )
    inputs.property("javaSourceTransformerCoordinate", toolVersions.getProperty("JAVA_SOURCE_TRANSFORMER"))
    inputs.property("diffPatchCoordinate", toolVersions.getProperty("DIFF_PATCH"))
    inputs.property("installerToolsCoordinate", toolVersions.getProperty("INSTALLER_TOOLS"))
    inputs.property("sideAnnotationStripperCoordinate", toolVersions.getProperty("MCF_SIDE_ANNOTATION_STRIPPER"))
    doFirst {
        systemProperty "nfrt.test.executable-jar", shadowJar.archiveFile.get().asFile.absolutePath
        systemProperty "nfrt.test.java-source-transformer-coordinate", toolVersions.getProperty("JAVA_SOURCE_TRANSFORMER")
        systemProperty "nfrt.test.java-source-transformer-jar", configurations.integrationTestJavaSourceTransformer.singleFile.absolutePath
        systemProperty "nfrt.test.diff-patch-coordinate", toolVersions.getProperty("DIFF_PATCH")
        systemProperty "nfrt.test.diff-patch-jar", configurations.integrationTestDiffPatch.singleFile.absolutePath
        systemProperty "nfrt.test.installer-tools-coordinate", toolVersions.getProperty("INSTALLER_TOOLS")
        systemProperty "nfrt.test.installer-tools-jar", configurations.integrationTestInstallerTools.singleFile.absolutePath
        systemProperty "nfrt.test.side-annotation-stripper-coordinate", toolVersions.getProperty("MCF_SIDE_ANNOTATION_STRIPPER")
        systemProperty "nfrt.test.side-annotation-stripper-jar", configurations.integrationTestSideAnnotationStripper.singleFile.absolutePath
    }
}
tasks.named("check") {
    dependsOn integrationTest
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'NeoFormRuntime'
                description = 'Standalone CLI tool to create artifacts used to compile mods against Minecraft'
                pomUtils.githubRepo(it, 'NeoFormRuntime')
                pomUtils.neoForgedDeveloper(it)
                pomUtils.license(it, PomUtilsExtension.License.LGPL_v2)
            }
        }
    }

    repositories {
        maven gradleutils.publishingMaven
    }
}

/**
 * Convenience IDE runs for IntelliJ for testing purposes.
 */

